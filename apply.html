<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chrislanduniversity</title>

    <style>

        
         body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
   }
   .about_us{
    background-color: #5b0746;
    color: white;
  padding: 12px 16px;
  font-size: 16px;
  border: none;
  cursor: pointer;
  border-radius: 4px
}
.about_us_drop_dowm {
    position: relative;
    display: inline-block;
}
.about_us_dropdown {
    display: none; /* Hides the menu by default */
  position: absolute; /* Takes the menu out of the document flow so it overlaps content below */
  background-color: #ffffff;
  min-width: 160px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  border-radius: 4px;
  z-index: 1;
}
.about_us_dropdown a{
    color: #333;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
}
.about_us_dropdown a:hover {
    background-color: #f1f1f1;
}
.about_us_drop_dowm:hover .about_us_dropdown {
    display: block; /* Shows the menu when hovering over the parent */
}


    </style>
</head>

</body>
</html>
